<!doctype html><html lang="is"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Veðurstöðvar & GPS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;font-family:system-ui,sans-serif}#map{background:#dbe7e9}.top{position:absolute;z-index:1000;top:12px;left:12px;right:12px;max-width:440px;background:#fffefef2;padding:12px;border-radius:14px;box-shadow:0 2px 14px #0003}.top strong{font-size:17px}.sub{font-size:12px;color:#555;margin-top:4px}.buttons{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:9px 11px;background:#1769aa;color:white;font-weight:600}button.secondary{background:#e9eef2;color:#183044}.bottom{position:absolute;bottom:20px;left:12px;right:12px;z-index:1000;pointer-events:none}.status{display:inline-block;background:#fff;padding:8px 12px;border-radius:10px;box-shadow:0 2px 8px #0002;font-size:12px;max-width:95%}.me{width:17px;height:17px;border:3px solid white;border-radius:50%;background:#1379fa;box-shadow:0 0 0 8px #1379fa30,0 1px 7px #0008}.station{background:#fff;border:2px solid #147d91;border-radius:15px;min-width:29px;height:27px;line-height:25px;text-align:center;font-weight:700;font-size:11px;box-shadow:0 1px 5px #0004}.station.cold{border-color:#3b79dd}.station.hot{border-color:#e58c34}</style></head><body><div id="map"></div><div class="top"><strong>🌦️ Veðurstöðvar & GPS</strong><div class="sub">Mælingar Vegagerðarinnar · staðsetning úr símanum</div><div class="buttons"><button id="loc">📍 Fylgja mér</button><button class="secondary" id="stop">Stöðva GPS</button><button class="secondary" id="refresh">↻ Uppfæra stöðvar</button></div></div><div class="bottom"><span class="status" id="status">Opnaðu í vafra með HTTPS og leyfðu staðsetningu.</span></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false}).setView([64.8,-18.6],7);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap | Gögn: Vegagerðin'}).addTo(map);
const status=document.getElementById('status');let watch=null,me=null,accuracy=null,follow=false,layer=L.layerGroup().addTo(map);const endpoint='https://vegasja.vegagerdin.is/arcgis/rest/services/data/info/MapServer/0/query';function val(x,unit=''){return x===null||x===undefined||x===''?'—':`${Number(x).toLocaleString('is-IS',{maximumFractionDigits:1})}${unit}`};function safe(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};
async function stations(){status.textContent='Sæki veðurstöðvar…';try{const u=new URL(endpoint);u.searchParams.set('where','1=1');u.searchParams.set('outFields','*');u.searchParams.set('returnGeometry','true');u.searchParams.set('outSR','4326');u.searchParams.set('f','geojson');const res=await fetch(u);if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!data.features)throw Error(data.error?.message||'Óvænt svar');layer.clearLayers();let n=0;for(const f of data.features){const c=f.geometry?.coordinates,p=f.properties||{};if(!c||c.length<2)continue;const t=Number(p.HITI),tstr=Number.isFinite(t)?`${t.toLocaleString('is-IS',{maximumFractionDigits:1})}°`:'🌡';const color=Number.isFinite(t)?t<0?'cold':t>12?'hot':'';const ico=L.divIcon({className:'',html:`<div class="station ${color}">${safe(tstr)}</div>`,iconSize:[36,30],iconAnchor:[18,15]});const html=`<b>${safe(p.NAFN||'Veðurstöð')}</b><hr>🌡 Lofthiti: ${val(p.HITI,' °C')}<br>🛣 Veghiti: ${val(p.VEGHITI,' °C')}<br>💨 Vindur: ${val(p.VINDHRADI,' m/s')}<br>🌬 Hviða: ${val(p.VINDHVIDA,' m/s')}<br>💧 Raki: ${val(p.RAKI,' %')}<br>🧭 Vindátt: ${safe(p.VINDATT_ASC||'—')}<br><small>Mælingar geta verið misgamlar; athugaðu tímasetningu hjá Vegagerðinni.</small>`;L.marker([c[1],c[0]],{icon:ico}).bindPopup(html).addTo(layer);n++}status.textContent=`${n} veðurstöðvar · síðast sótt ${new Date().toLocaleTimeString('is-IS')}`;}catch(e){status.textContent='Ekki tókst að sækja stöðvar: '+e.message+' (mögulega CORS).';}}
function start(){if(!navigator.geolocation){status.textContent='GPS ekki stutt í þessum vafra';return}if(watch!==null)navigator.geolocation.clearWatch(watch);follow=true;status.textContent='Bíð eftir GPS…';watch=navigator.geolocation.watchPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude];if(!me){me=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[23,23],iconAnchor:[11,11]})}).addTo(map).bindPopup('Þín staðsetning')}else me.setLatLng(ll);if(accuracy)map.removeLayer(accuracy);accuracy=L.circle(ll,{radius:pos.coords.accuracy,color:'#1379fa',weight:1,fillOpacity:.06}).addTo(map);if(follow)map.setView(ll,Math.max(map.getZoom(),11));status.textContent=`GPS ±${Math.round(pos.coords.accuracy)} m · ${new Date().toLocaleTimeString('is-IS')}`},err=>{status.textContent='GPS villa: '+err.message},{enableHighAccuracy:true,maximumAge:2000,timeout:20000})}document.getElementById('loc').onclick=start;document.getElementById('stop').onclick=()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;follow=false;status.textContent='GPS stöðvað'};document.getElementById('refresh').onclick=stations;map.on('dragstart',()=>follow=false);stations();setInterval(stations,5*60*1000);
</script></body></html>
